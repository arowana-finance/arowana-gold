name: foundry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: make verify (build + offline tests)
        run: make verify

  # fork tests hit live Arbitrum VerifierProxy — manual/nightly only
  fork:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: make test-fork
        run: make test-fork
        env:
          ARB_RPC: ${{ secrets.ARB_RPC }}
